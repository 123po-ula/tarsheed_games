<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صيد الإهدار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap">
<style>
:root{--bg:#dff1ff;--card:#fff;--tx:#0d2b45;--mu:#4b6b86;--bd:#b5d5ea;--a:#0b84c6;--b:#f2b705;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08162b;--card:#10294a;--tx:#eaf5fa;--mu:#9db8cc;--bd:#244a68;--a:#4cb8f0;--b:#ffd24a}}
:root[data-theme="dark"]{--bg:#08162b;--card:#10294a;--tx:#eaf5fa;--mu:#9db8cc;--bd:#244a68;--a:#4cb8f0;--b:#ffd24a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2rem;font-weight:800;margin:6px 0 0}
h2{margin:0 0 6px;font-weight:800}
.sub{color:var(--mu);margin:4px 0 8px}
.hud{font-weight:800;color:var(--a);margin-bottom:8px;font-size:1.1rem}
.arena{position:relative;height:min(62vh,520px);border:2px solid var(--bd);border-radius:20px;background:linear-gradient(var(--card),var(--bg));overflow:hidden;touch-action:manipulation}
.it{position:absolute;width:56px;height:56px;border:0;border-radius:50%;font-size:32px;line-height:1;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;padding:0}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,22,43,.55);z-index:5}
.pn{background:var(--card);color:var(--tx);border-radius:18px;padding:18px 20px;text-align:center;max-width:380px}
.pn p{margin:4px 0 10px}
.go{padding:10px 24px;border:0;border-radius:99px;background:var(--b);color:#0d2b45;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
button:focus-visible{outline:3px solid var(--a);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>🎣 صيد الإهدار</h1>
<p class="sub">دوس على الحاجات اللي بتضيّع ميه أو كهرباء عشان توقّفها. ماتدوسش على النباتات 🌱. كل ٥ نقاط بتفتحلك معلومة.</p>
<div class="hud" id="s">النقاط: 0 / 30</div>
<div class="arena" id="ar"><div class="ov" id="ov"><div class="pn"><h2>جاهز؟</h2><p>اصطاد 💧 و💡 و🔌 و🚿 قبل ما تنزل لآخر الشاشة، وتجنّب 🌱 و🌳.</p><button class="go" onclick="start()">ابدأ ▶</button></div></div></div>
</main>
<script>
const B=["💧","💡","🔌","🚿"],GD=["🌱","🌳"];
const FX=["التنقيط المستمر بيضيّع لترات كتير كل يوم، ومئات اللترات في شهور.","أي لمبة مولّعة في مكان فاضي بتستهلك كهرباء من غير فايدة.","الأجهزة المتوصلة بالفيشة بتسحب كهرباء حتى وهي مطفية.","الحنفية المفتوحة بتصرف لترات كل دقيقة، فنقفلها وقت ما منحتاجهاش.","لمبة الـLED بتوفر حوالي ٧٥ لـ٨٠٪ من الكهرباء مقارنة باللمبة القديمة.","البلاغ السريع عن أي تسريب في المدرسة بيوفر ميه للكل."];
const AR=document.getElementById("ar"),OV=document.getElementById("ov"),SC=document.getElementById("s");
let sc=0,run=false,its=[],last=0,tm=0,seen=new Set();
function ov(h){OV.innerHTML=`<div class="pn">${h}</div>`;OV.style.display="flex"}
function upd(){SC.textContent=`النقاط: ${sc} / 30`}
function start(){AR.querySelectorAll(".it").forEach(x=>x.remove());sc=0;its=[];tm=0;seen=new Set();upd();OV.style.display="none";run=true;last=performance.now();requestAnimationFrame(loop)}
function go2(){OV.style.display="none";run=true;last=performance.now();requestAnimationFrame(loop)}
function spawn(){const bad=Math.random()<.78,l=bad?B:GD,e=document.createElement("button");
 e.className="it";e.textContent=l[Math.floor(Math.random()*l.length)];
 e.style.left=Math.random()*(AR.clientWidth-56)+"px";e.style.top="-56px";AR.appendChild(e);
 const o={e,y:-56,bad,v:70+Math.random()*40+sc*2};e.onclick=()=>hit(o);its.push(o)}
function loop(ts){if(!run)return;const dt=Math.min(.05,(ts-last)/1000);last=ts;tm+=dt;
 if(tm>.85){tm=0;spawn()}
 its=its.filter(o=>{o.y+=o.v*dt;o.e.style.top=o.y+"px";if(o.y>AR.clientHeight){o.e.remove();return false}return true});
 requestAnimationFrame(loop)}
function hit(o){if(!run)return;o.e.remove();its=its.filter(x=>x!==o);
 if(o.bad){sc++;upd();
  if(sc%5===0&&!seen.has(sc)){seen.add(sc);run=false;const w=sc>=30;
   ov(`<h2>${w?'🏆 كسبت!':'🎉 معلومة جديدة'}</h2><p>${FX[sc/5-1]}</p><button class="go" onclick="${w?'start()':'go2()'}">${w?'العب تاني':'كمّل ▶'}</button>`)}}
 else{sc=Math.max(0,sc-1);upd()}}
</script>
</body>
</html>
