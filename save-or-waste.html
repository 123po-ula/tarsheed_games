<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بيوفر ولا بيضيّع؟</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap">
<style>
:root{--bg:#eef8ec;--card:#fff;--tx:#17361f;--mu:#4f6f58;--bd:#c6e2c9;--a:#1f9d55;--b:#e0562f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d2216;--card:#153020;--tx:#e9f7ec;--mu:#9ec2a6;--bd:#2c5a3a;--a:#4cd98a;--b:#ff8a66}}
:root[data-theme="dark"]{--bg:#0d2216;--card:#153020;--tx:#e9f7ec;--mu:#9ec2a6;--bd:#2c5a3a;--a:#4cd98a;--b:#ff8a66}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2rem;font-weight:800;margin:6px 0 0}
.sub{color:var(--mu);margin:4px 0 12px}
.cnt{font-weight:700;color:var(--a);margin:4px 0}
.card{background:var(--card);border:2px solid var(--bd);border-radius:22px;padding:28px 20px;font-size:1.35rem;font-weight:700;text-align:center;min-height:130px;display:flex;align-items:center;justify-content:center}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.yes,.no{padding:16px;border:0;border-radius:16px;font:inherit;font-size:1.15rem;font-weight:800;color:#fff;cursor:pointer}
.yes{background:#1a9a5e}
.no{background:#d9482f}
.fb{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--card);border-inline-start:8px solid var(--a)}
.fb.w{border-inline-start-color:var(--b)}
.fb p{margin:4px 0 8px}
.nx{padding:10px 22px;border:0;border-radius:99px;background:#ffd24a;color:#17361f;font:inherit;font-weight:800;cursor:pointer}
.res{text-align:center;background:var(--card);border-radius:20px;padding:24px;margin-top:10px}
button:focus-visible{outline:3px solid var(--a);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>♻️ بيوفر ولا بيضيّع؟</h1>
<p class="sub">اقرا كل تصرّف وقرر: بيوفر ميه وكهرباء ولا بيضيّعها؟ وبعد كل إجابة هتاخد معلومة.</p>
<div id="m"></div>
</main>
<script>
const D=[
["أقفل الحنفية وأنا بحط الصابون على إيدي",1,"الحنفية المفتوحة بتصرف لترات كل دقيقة من غير فايدة."],
["أسيب الأنوار مولّعة في الفصل بعد آخر حصة",0,"أي حاجة بتتنسى مولّعة بتستهلك كهرباء طول الليل وأيام الإجازة."],
["أفصل الشاحن بعد ما أخلّص",1,"الأجهزة في وضع الاستعداد بتفضل تسحب كهرباء."],
["أشوف حنفية بتنقّط وأقول مش مهم",0,"التنقيط المستمر بيضيّع لترات كتير كل يوم. الأحسن نبلّغ الإدارة."],
["أفتح الستاير وأطفي اللمبات الصبح",1,"الإضاءة الطبيعية بتكفي أغلب ساعات النهار."],
["أغسل الفاكهة في إناء مش تحت حنفية مفتوحة",1,"غسل الأكل في إناء بيوفر ميه مقارنة بالحنفية المفتوحة."],
["أسيب المروحة شغالة وأنا خارج من الفصل",0,"المروحة في فصل فاضي بتستهلك كهرباء من غير ما حد يستفيد منها."],
["أبلّغ عن ماسورة بتسرّب في الحمام",1,"التسريب الصغير ممكن يضيّع مئات اللترات مع الوقت، والبلاغ السريع بيوقفه."],
["أشغّل التكييف على ١٦ درجة والباب مفتوح",0,"الدرجة المعتدلة وقفل الأبواب والشبابيك بيوفروا كهرباء."],
["أستخدم لمبة LED بدل القديمة",1,"لمبة الـLED بتوفر حوالي ٧٥ لـ٨٠٪ من الكهرباء وبتعيش أطول."]];
const M=document.getElementById("m");
let q,n,sc,an;
function init(){q=D.map((_,i)=>i).sort(()=>Math.random()-.5);n=0;sc=0;an=null;draw()}
function draw(){
 if(n>=D.length){M.innerHTML=`<div class="res"><h2>${sc>=9?'🏆':sc>=6?'👏':'💪'} نتيجتك ${sc} من ${D.length}</h2><p>${sc>=9?'أنت بطل الترشيد!':sc>=6?'كويس جدًا، كمّل!':'جرّب تاني وهتتحسّن.'}</p><button class="nx" onclick="init()">العب تاني</button></div>`;return}
 const d=D[q[n]];
 M.innerHTML=`<p class="cnt">${n+1} من ${D.length} · النقاط ${sc}</p><div class="card">${d[0]}</div>`+
 (an===null?`<div class="btns"><button class="yes" onclick="ans(1)">✅ بيوفر</button><button class="no" onclick="ans(0)">❌ بيضيّع</button></div>`
 :`<div class="fb ${an===d[1]?'':'w'}"><b>${an===d[1]?'🎉 إجابة صح!':'🙂 مش كده'} ${d[1]?'ده بيوفر':'ده بيضيّع'}</b><p>${d[2]}</p><button class="nx" onclick="nx()">التالي ←</button></div>`)}
function ans(v){an=v;if(v===D[q[n]][1])sc++;draw()}
function nx(){n++;an=null;draw()}
init();
</script>
</body>
</html>
