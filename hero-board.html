<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة بطل الترشيد</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#eaf5fa;--card:#fff;--tx:#0d2b45;--mu:#52708a;--bd:#c5dcea;--w:#0b84c6;--e:#f2b705;--ok:#16915a;--bad:#d1432f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1c2e;--card:#12304a;--tx:#eaf5fa;--mu:#9db8cc;--bd:#244a68;--w:#4cb8f0;--e:#ffd24a;--ok:#38c486;--bad:#ff7b66}}
:root[data-theme="dark"]{--bg:#0a1c2e;--card:#12304a;--tx:#eaf5fa;--mu:#9db8cc;--bd:#244a68;--w:#4cb8f0;--e:#ffd24a;--ok:#38c486;--bad:#ff7b66}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.7}
#app{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2.1rem;font-weight:800;margin:8px 0 0;line-height:1.3}
h2{font-size:1.5rem;font-weight:800;margin:8px 0}
.sub{color:var(--mu);margin:4px 0 16px}
.bar{height:10px;border-radius:99px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--w),var(--e));transition:width .5s}
.cnt{color:var(--mu);font-size:.9rem;margin:6px 0 14px}
.slog{display:flex;flex-wrap:wrap;gap:8px;padding:14px;border:2px dashed var(--bd);border-radius:18px;margin-bottom:18px}
.w{display:inline-block;min-width:44px;text-align:center;padding:4px 14px;border-radius:99px;background:var(--e);color:#0d2b45;font-weight:800;font-size:1.1rem}
.w.off{background:transparent;border:2px dashed var(--bd);color:var(--mu);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border:1px solid var(--bd);border-top:6px solid var(--w);border-radius:16px;background:var(--card);color:var(--tx);font:inherit;text-align:start;cursor:pointer;min-height:130px}
.tile.e{border-top-color:var(--e)}
.tile .ic{font-size:2rem;line-height:1.2}
.tile b{font-weight:800}
.tile small{color:var(--mu)}
.tile em{font-style:normal;color:var(--ok);font-weight:800;margin-top:auto}
.tile.done{outline:2px solid var(--ok)}
button:focus-visible{outline:3px solid var(--w);outline-offset:2px}
.win{background:var(--ok);color:#fff;padding:16px;border-radius:16px;margin-bottom:18px;font-weight:600}
.win button,.next{margin-top:10px;padding:10px 20px;border:0;border-radius:99px;background:var(--e);color:#0d2b45;font:inherit;font-weight:800;cursor:pointer}
.back{border:0;background:none;color:var(--w);font:inherit;font-weight:600;cursor:pointer;padding:8px 0}
.box{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px}
.tag{display:inline-block;font-size:.85rem;color:var(--mu);border:1px solid var(--bd);border-radius:99px;padding:0 12px}
.q{font-size:1.2rem;font-weight:600;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:start;padding:14px 16px;margin:10px 0;border:2px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);font:inherit;font-size:1.05rem;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--w)}
.opt:disabled{cursor:default}
.opt.bad{border-color:var(--bad);color:var(--bad);opacity:.75;animation:sh .35s}
.opt.good{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.pick{border-color:var(--w);font-weight:600}
.msg{color:var(--bad);font-weight:600}
.info{margin-top:16px;padding:16px;border-radius:16px;background:var(--bg);border-inline-start:6px solid var(--ok)}
.info p{margin:6px 0}
@keyframes sh{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const S=[
{i:"💡",k:"e",t:"المفتاح الواحد",w:"المدرسة",q:"الفصل منوّر من الشباك، وكل لمبات الفصل على مفتاح واحد. تعمل إيه؟",o:["أسيب كل اللمبات مولّعة","أطفيها وأفتح الستاير","أولّع المراوح كمان"],a:1,f:"الإضاءة الطبيعية بتكفي أغلب ساعات النهار. ولو المفاتيح في الفصل منفصلة، نقدر نولّع الجزء اللي محتاجينه بس."},
{i:"🚰",k:"w",t:"اكتشف التسريب",w:"المدرسة",q:"أي حنفية من دول بتسرّب ميه؟",o:["🚰 حنفية مقفولة كويس","🚰💧 حنفية بتنقّط","🚰 حنفية مقفولة كويس برضه"],a:1,f:"التنقيط المستمر بيضيّع لترات كتير كل يوم، ومئات اللترات في شهور. لو شُفنا حنفية أو مخرج ميه حريق بيسرّب، نبلّغ الإدارة فورًا."},
{i:"🧼",k:"w",t:"صح ولا غلط",w:"المدرسة",q:"قفل الحنفية وإحنا بنحط الصابون على إيدينا بيوفر ميه.",o:["✅ صح","❌ غلط"],a:0,f:"الحنفية المفتوحة بتصرف لترات كل دقيقة من غير فايدة. نفتحها بس وقت الشطف."},
{i:"🚪",k:"e",t:"آخر واحد يطلع",w:"المدرسة",q:"إحنا خارجين من الفصل آخر اليوم. إيه اللي نفتكره؟",o:["الأنوار والمراوح والأجهزة","الأنوار بس","مفيش حاجة، الحارس هيقفل"],a:0,f:"أي حاجة بتتنسى مولّعة بتستهلك كهرباء طول الليل وأيام الإجازة."},
{i:"🔆",k:"e",t:"أي لمبة أوفر؟",w:"المدرسة",q:"أي لمبة بتوفر كهرباء أكتر؟",o:["💡 لمبة LED","🔥 لمبة قديمة"],a:0,f:"لمبة الـLED بتوفر حوالي ٧٥ لـ٨٠٪ من الكهرباء مقارنة باللمبة القديمة، وبتعيش أطول."},
{i:"❄️",k:"e",t:"التكييف",w:"المدرسة",q:"أنسب درجة للتكييف في الفصل؟",o:["١٦ درجة","٢٤ لـ٢٦ درجة","٣٢ درجة"],a:1,f:"الدرجة المعتدلة بتوفر كهرباء. وقفل الأبواب والشبابيك وقت التكييف بيمنع ضياع التبريد."},
{i:"🚽",k:"w",t:"السيفون الغلبان",w:"البيت",q:"سمعت صوت ميه في الحمام من غير ما حد يستخدمه. تعمل إيه؟",o:["أبلّغ حد كبير عشان يتصلّح","أسيبه، أكيد هيقف لوحده","أقفل باب الحمام"],a:0,f:"تسريب السيفون ممكن يضيّع مئات اللترات في اليوم من غير ما نحس."},
{i:"🔌",k:"e",t:"الأجهزة النايمة",w:"البيت",q:"التلفزيون والشاحن مفيش حد بيستخدمهم لكن متوصلين بالفيشة. نسيبهم؟",o:["أيوه، مش هتفرق","لأ، نفصلهم"],a:1,f:"الأجهزة في وضع الاستعداد بتفضل تسحب كهرباء حتى وهي مطفية."},
{i:"🎯",k:"e",t:"اصطاد الإهدار",w:"المدرسة",y:"m",q:"اختار كل المواقف اللي فيها إهدار (فيه أكتر من إجابة)",o:["🚰 حنفية مفتوحة والحمام فاضي","🧼 قفلت الحنفية وأنا بحط الصابون","💡 لمبة مولّعة في فصل فاضي","🚪 قفلت باب الفصل والتكييف شغال","🌀 مروحة شغالة ومفيش حد في الفصل"],a:[0,2,4],f:"الحنفية واللمبة والمروحة المنسية بتستهلك كل يوم من غير ما نحس. العادة الصح إننا نقفل أي حاجة مش بنستخدمها."},
{i:"📋",k:"w",t:"رتّب الخطوات",w:"المدرسة",y:"o",q:"رتّب خطوات غسل الإيدين من غير إهدار. دوس على الخطوات بالترتيب الصح",o:["بلّل إيديك وقفل الحنفية","افرك بالصابون حوالي ٢٠ ثانية","افتح الحنفية واشطف","اقفل الحنفية كويس"],a:0,f:"الفرك بالصابون حوالي ٢٠ ثانية بينضّف كويس، وقفل الحنفية وقت الفرك بيوفر ميه من غير ما نقلل النضافة."},
{i:"🧯",k:"w",t:"بلاغ التسريب",w:"المدرسة",q:"لقيت مخرج ميه الحريق في الطرقة بيسرّب ميه. تعمل إيه؟",o:["أبلّغ الإدارة أو المشرف فورًا","أحاول أصلحه بنفسي","أسيبه، مش شغلي"],a:0,f:"ميه الحريق مخصصة للطوارئ، وتسريبها إهدار وخطر. البلاغ السريع بيحمي المدرسة ويوفر الميه."},
{i:"🏠",k:"w",t:"عادات البيت",w:"البيت",y:"m",q:"اختار كل العادات اللي بتوفر ميه في البيت (فيه أكتر من إجابة)",o:["🪥 أقفل الحنفية وأنا بنضّف سناني","🚗 أغسل العربية بخرطوم مفتوح","🚿 آخد دش قصير","🚰 أسيب الحنفية مفتوحة عشان الميه تبرد","🥬 أستخدم ميه غسيل الخضار في سقي الزرع"],a:[0,2,4],f:"عادات صغيرة بتوفر لترات كل يوم، ولما البيت كله يعملها الفرق بيبان في الفاتورة."}
];
const W="كل نقطة ميه وكل لمبة بتفرق في مدرستنا وفي بيتنا وفي بلدنا".split(" ");
let done=S.map(()=>false),cur=0,ord=[],bad=[],sel=[],ok=false;
const A=document.getElementById("app");
function sh(n){return [...Array(n).keys()].sort(()=>Math.random()-.5)}
function home(){
 const n=done.filter(Boolean).length,all=n===S.length;
 A.innerHTML=`<h1>💧 بطل الترشيد ⚡</h1><p class="sub">ترشيد الكهرباء والمياه في المدرسة والبيت. حلّ كل مرحلة وخد معلومة وكلمة من الشعار.</p>
 <div class="bar"><i style="width:${n/S.length*100}%"></i></div><p class="cnt">${n} من ${S.length} مراحل</p>
 <div class="slog">${W.map((w,i)=>`<span class="w${done[i]?'':' off'}">${done[i]?w:'؟'}</span>`).join("")}</div>
 ${all?`<div class="win">🏆 أحسنت! كمّلت كل المراحل وبقيت بطل الترشيد في المدرسة والبيت.<br><button onclick="reset()">العب تاني</button></div>`:""}
 <div class="grid">${S.map((s,i)=>`<button class="tile ${s.k}${done[i]?' done':''}" onclick="go(${i})"><span class="ic">${s.i}</span><b>${s.t}</b><small>${s.w}</small>${done[i]?'<em>✓ '+W[i]+'</em>':''}</button>`).join("")}</div>`;
 scrollTo(0,0)}
function go(i){cur=i;sel=[];bad=[];ok=done[i];do{ord=sh(S[i].o.length)}while(S[i].y==="o"&&ord.every((v,j)=>v===j));view();scrollTo(0,0)}
function view(){const s=S[cur];
 A.innerHTML=`<button class="back" onclick="home()">→ الرئيسية</button>
 <div class="box"><span class="tag">${s.w}</span><h2>${s.i} ${s.t}</h2><p class="q">${s.q}</p>
 <div class="opts">${opts(s)}</div>
 ${bad.length&&!ok?'<p class="msg">مش دي 🙂 جرّب تاني</p>':''}
 ${ok?`<div class="info"><b>🎉 إجابة صح! دي معلومة ليك:</b><p>${s.f}</p><p>الكلمة اللي كسبتها: <span class="w">${W[cur]}</span></p><button class="next" onclick="home()">كمّل ←</button></div>`:''}</div>`}
function pick(k){if(k===S[cur].a){done[cur]=true;ok=true}else bad.push(k);view()}
function opts(s){
 if(s.y==="m")return ord.map(k=>`<button class="opt${sel.includes(k)?' pick':''}${ok&&s.a.includes(k)?' good':''}" ${ok?'disabled':''} onclick="tog(${k})">${s.o[k]}</button>`).join("")+(ok?'':`<button class="next" onclick="chk()">تأكد ✓</button>`);
 if(s.y==="o")return ord.map(k=>{const g=ok||sel.includes(k);return `<button class="opt${g?' good':''}" ${g?'disabled':''} onclick="seq(${k})">${g?(k+1)+'. ':''}${s.o[k]}</button>`}).join("");
 return ord.map(k=>`<button class="opt${bad.includes(k)?' bad':''}${ok&&k===s.a?' good':''}" ${ok||bad.includes(k)?'disabled':''} onclick="pick(${k})">${s.o[k]}</button>`).join("")}
function tog(k){bad=[];sel=sel.includes(k)?sel.filter(x=>x!==k):[...sel,k];view()}
function chk(){const a=S[cur].a;if(sel.length===a.length&&a.every(x=>sel.includes(x))){done[cur]=true;ok=true}else bad=[1];view()}
function seq(k){if(k===sel.length){sel=[...sel,k];bad=[];if(sel.length===S[cur].o.length){done[cur]=true;ok=true}}else{sel=[];bad=[1]}view()}
function reset(){done=S.map(()=>false);home()}
home();
</script>
</body>
</html>
